name: Update

on:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency: update

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.check.outputs.go == 'true' }}
      old_version: ${{ steps.run.outputs.old_version }}
      version: ${{ steps.run.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=/dev/kvm
          sudo udevadm settle
          test -r /dev/kvm -a -w /dev/kvm
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      - id: run
        name: Run update script
        run: nix shell nixpkgs#jq nixpkgs#gnupg nixpkgs#dpkg nixpkgs#curl -c scripts/update.sh
      - id: check
        name: Skip if an open update PR already pins this version
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.run.outputs.version }}
        shell: bash
        run: |
          titles=$(gh pr list --repo "$GITHUB_REPOSITORY" --head update/aws-emulator --state open --json title --jq '.[].title')
          go=true
          while IFS= read -r title; do
            if [[ "$title" == *" -> $VERSION" ]]; then
              go=false
              break
            fi
          done <<< "$titles"
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - name: Run flake checks
        if: steps.check.outputs.go == 'true'
        run: nix flake check -L
      - name: Upload updated sources.json
        if: steps.check.outputs.go == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: pkgs/aws-emulator/sources.json

  arm:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: pkgs/aws-emulator
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build aarch64 smoke check
        run: nix build -L .#checks.aarch64-linux.smoke

  pr:
    needs: [update, arm]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: pkgs/aws-emulator
      - id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update/aws-emulator
          title: "aws-emulator: ${{ needs.update.outputs.old_version }} -> ${{ needs.update.outputs.version }}"
          commit-message: "aws-emulator: ${{ needs.update.outputs.old_version }} -> ${{ needs.update.outputs.version }}"
          body: |
            Updates `aws-emulator` from `${{ needs.update.outputs.old_version }}` to [`${{ needs.update.outputs.version }}`](https://github.com/aws/aws-emulator/releases/tag/v${{ needs.update.outputs.version }}).

            Verified in [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}):
            - `x86_64-linux`: `nix flake check` (including format, smoke, and NixOS VM test) passed.
            - `aarch64-linux`: `.#checks.aarch64-linux.smoke` passed.

            Merged automatically by the update workflow because both checks passed.
          delete-branch: true
      - name: Merge the verified update
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
